# ==============================================================================
# ISL Setu — Full Stack Docker Compose (Production Simulation & Local Dev)
# ==============================================================================

version: "3.8"

services:
  # Python FastAPI AI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isl-setu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
      - SUPABASE_URL=${VITE_SUPABASE_URL:-https://nndjafynozneorhvpxvg.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # React 19 Frontend Web Application
  frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        EXPOSE 5173
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    container_name: isl-setu-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://nndjafynozneorhvpxvg.supabase.co}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
